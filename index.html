<!-- index.html — COMPLETE FINAL BUILD (game + mobile + sound) -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blocky Bros — Final</title>
<style>
 html,body{margin:0;height:100%;background:#111;font-family:monospace;color:#eee;
   display:flex;flex-direction:column;align-items:center;justify-content:center;
   overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
 canvas{image-rendering:pixelated;border:4px solid #444;max-width:100vw;max-height:70vh}
 #controls{display:none;gap:40px;margin-top:14px}
 .tbtn{width:72px;height:72px;border-radius:50%;background:#333;border:3px solid #666;
   color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;
   touch-action:none}
 .tbtn:active{background:#666}
 #leftGroup{display:flex;gap:16px}
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<div id="controls">
  <div id="leftGroup">
    <div class="tbtn" id="btnL">←</div>
    <div class="tbtn" id="btnR">→</div>
  </div>
  <div class="tbtn" id="btnJ">▲</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height,TS=40;

// . empty  G ground  B brick  ? block  P pipe  C coin  U 1-up  M checkpoint  F flag
const LEVELS=[
[
"................................................................",
"................................................................",
"..........C.C.C....................................C.C.C.......",
".........BBBBB.....................?B?............BBBBBB.......",
"....................C.C................U....................F..",
"....?..............BBBBB.......BB.....B.B.........BB........F..",
"...BBB.................................C.C................F....",
"..........P.................C.C...BBBB...............BB....F...",
"..........P........M.............................BBBBB.....FF..",
"....B.B...P....?...C.C.......B.B...........................FF..",
"GGGGGGGGGGGGGGGGGGGGGGGGGGGGG.GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
"GGGGGGGGGGGGGGGGGGGGGGGGGGGGG.GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG"
],
[
"........................................................C.C.C..............................................F..",
".............................C.C....................................?B?..............BBBB.................F..",
"..................BBB........BBBB..................BBB.................U.......C.C..........................F..",
"..................BBB........BBBB.............................BBBBBB....................B.B...............F...",
".......C.C...............?..........BBB....BBB.......................BBB.........P........C.C............F...",
"......BBBB...........................BBB....BBB........B.B................................P................F..",
".................BB...............................C.C.......P..................................BBB......F....",
".....?.......................................P..............P........?........C.C.................F.......F..",
".....BBB..........C.C.....M.......B.B........P.....B.B.......P.......BBB......................B.B....F.......F",
"GGGGGGGGGGGGGG.....GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG...GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
"GGGGGGGGGGGGGG.....GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG...GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG"
],
[
".............................................................................................................F..",
"..................C.C.C..........................C.C.C.C......................C.C.C...........BBB...........F..",
".................BBBBB..................B.......BBBBBBB.....................BBBBBBB.........................F..",
"..........................C.C......................BB...........................B.B....?....................F..",
".......B..............BBBBBB.....BBB........C.C...............BBB..........U...............C.C.C...........F..",
"......BBB........................BBBBB.......BBB..............BBB.......P.................................F...",
"..............BBB..........?..........B...............?........................P........BBB...........F......",
"....?.......B.BBBB........BBBB........B......BBB...........B.B.............P....?.......BBBB........F........",
"....BBB........M............B.....................B.B......B.B....B.B......P......................F..........",
"GGGGGGGGGGGGG....GGGGGGGGGGGGG...GGGGGGGGG....GGGGGGGGGGGGGGGGGGGGGG....GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
"GGGGGGGGGGGGG....GGGGGGGGGGGGG...GGGGGGGGG....GGGGGGGGGGGGGGGGGGGGGG....GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG"
]];

let solids=[],coins=[],blocks=[],enemies=[],pickups=[],checkpoints=[],goalX=0,levelW=0;
let levelIndex=0,score=0,tick=0,nextLifeAt=5000;
let lives=3,maxLives=3,coinCount=0;
let won=false,gameOver=false,deathAnim=0,levelStartFade=120;
let checkpoint=null,camX=0;
let floaters=[],coinParticles=[],coinMagnet=0;

const player={x:80,y:60,w:28,h:36,vx:0,vy:0,onGround:false,face:1,invuln:0,state:'alive'};
const GRAV=0.55,MOVE=0.6,JUMP=-11.5;
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if((e.code==='Enter'||e.code==='Space')&&(gameOver||won))resetGame();
  if(e.code==='KeyM'){muted=!muted;floaters.push({text:muted?'MUTED':'SOUND ON',x:player.x,y:player.y-30,life:60,color:'#fff'});}
});
addEventListener('keyup',e=>keys[e.code]=false);

// ---- SOUND ENGINE (Web Audio, no files needed) ----
let audioCtx=null,muted=false;
function getAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function beep(type,f1,f2,dur,vol=0.15){
  if(muted)return;
  try{
    const ac=getAudio();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;
    o.frequency.setValueAtTime(f1,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),ac.currentTime+dur);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
const SFX={
  jump:    ()=>beep('square',300,600,0.15),
  coin:    ()=>{beep('square',988,988,0.08);setTimeout(()=>beep('square',1319,1319,0.15),80);},
  stomp:   ()=>beep('square',250,80,0.12,0.2),
  bump:    ()=>beep('square',120,60,0.10,0.2),
  die:     ()=>{beep('square',400,300,0.15);setTimeout(()=>beep('square',300,200,0.15),150);setTimeout(()=>beep('square',200,80,0.4),300);},
  oneUp:   ()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep('triangle',f,f,0.12,0.2),i*120));},
  checkpoint:()=>{[660,880].forEach((f,i)=>setTimeout(()=>beep('triangle',f,f,0.12,0.18),i*120));},
  win:     ()=>{[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>beep('square',f,f,0.15,0.2),i*140));},
  gameover:()=>{[392,330,262,196].forEach((f,i)=>setTimeout(()=>beep('square',f,f,0.25,0.2),i*250));}
};
addEventListener('keydown',()=>getAudio(),{once:true});
addEventListener('touchstart',()=>getAudio(),{once:true});

// ---- MOBILE TOUCH CONTROLS ----
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.getElementById('controls').style.display='flex';
function bindBtn(id,code){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[code]=true;};
  const off=e=>{e.preventDefault();keys[code]=false;};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
}
bindBtn('btnL','ArrowLeft');
bindBtn('btnR','ArrowRight');
bindBtn('btnJ','Space');
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameOver||won)resetGame();
  else keys['Space']=true;
},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();keys['Space']=false;},{passive:false});

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// ---------------- LIVES ----------------
function gainLife(n=1,reason=''){
  lives+=n;maxLives=Math.max(maxLives,lives);
  SFX.oneUp();
  floaters.push({text:reason||'+1 LIFE',x:player.x,y:player.y-10,life:60,color:'#3f3'});
}
function spendLife(){
  lives--;
  if(lives<=0){gameOver=true;deathAnim=9999;SFX.gameover();}
  else{deathAnim=90;}
}
function checkScoreLives(){
  if(score>=nextLifeAt){gainLife(1,'BONUS LIFE!');nextLifeAt+=5000;}
}
function resetGame(){
  lives=3;maxLives=3;score=0;levelIndex=0;nextLifeAt=5000;coinCount=0;
  checkpoint=null;won=false;gameOver=false;
  loadLevel(0);
}

// ---------------- LEVEL LOAD ----------------
function loadLevel(i){
  solids=[];coins=[];blocks=[];enemies=[];pickups=[];checkpoints=[];goalX=0;
  coinParticles=[];coinMagnet=0;checkpoint=null;
  const lv=LEVELS[i];levelW=lv[0].length*TS;
  lv.forEach((row,r)=>{
    for(let c=0;c<row.length;c++){
      const ch=row[c],x=c*TS,y=r*TS;
      if(ch==='G'||ch==='B'||ch==='P')solids.push({x,y,w:TS,h:TS,ch});
      if(ch==='?'){blocks.push({x,y,w:TS,h:TS});solids.push({x,y,w:TS,h:TS,ch:'?'});}
      if(ch==='C')coins.push({x:x+TS/2,y:y+TS/2,r:8,taken:false});
      if(ch==='U')pickups.push({x:x+8,y:y+8,w:24,h:24,taken:false});
      if(ch==='M')checkpoints.push({x,y,active:false});
      if(ch==='F')goalX=Math.max(goalX,x);
    }
  });
  lv.forEach((row,r)=>{
    for(let c=4;c<row.length-4;c+=7){
      if(row[c]==='.'&&lv[r+1]&&'GB'.includes(lv[r+1][c])&&Math.random()<0.55){
        enemies.push({x:c*TS,y:(r+1)*TS-28,w:32,h:28,vx:(Math.random()<0.5?-1.2:1.2),squashed:0});
      }
    }
  });
  respawnPlayer();
  camX=0;levelStartFade=120;
}
function respawnPlayer(){
  const spawn=checkpoint||{x:80,y:60};
  player.x=spawn.x;player.y=spawn.y-40;
  player.vx=0;player.vy=0;player.invuln=90;player.state='alive';
}
function killPlayer(){
  if(player.state!=='alive')return;
  player.state='dying';player.vy=-10;spendLife();SFX.die();
}

// ---------------- COINS ----------------
function collectCoin(x,y){
  SFX.coin();
  coinCount++;score+=100;
  if(coinCount>=100){coinCount-=100;gainLife(1,'100 COIN 1-UP!');}
  else floaters.push({text:'+100',x:x-10,y:y-10,life:40,color:'#fd3'});
  for(let i=0;i<6;i++){
    coinParticles.push({x,y,vx:(Math.random()-0.5)*4,vy:-Math.random()*4-2,life:25+Math.random()*10});
  }
  checkScoreLives();
}

// ---------------- PHYSICS ----------------
function physics(){
  if(player.state==='dying'){
    player.vy=Math.min(player.vy+GRAV,14);player.y+=player.vy;return;
  }
  if(keys.ArrowLeft||keys.KeyA){player.vx=-MOVE;player.face=-1;}
  else if(keys.ArrowRight||keys.KeyD){player.vx=MOVE;player.face=1;}
  else player.vx*=0.8;
  if((keys.ArrowUp||keys.KeyW||keys.Space)&&player.onGround){player.vy=JUMP;player.onGround=false;SFX.jump();}

player.vy=Math.min(player.vy+GRAV,14);
  player.x+=player.vx;
  player.x=Math.max(0,Math.min(player.x,levelW-player.w));
  for(const s of solids)if(hit(player,s)){player.x=player.vx>0?s.x-player.w:s.x+s.w;player.vx=0;}
  player.y+=player.vy;player.onGround=false;
  for(const s of solids)if(hit(player,s)){
    if(player.vy>0){player.y=s.y-player.h;player.vy=0;player.onGround=true;}
    else{player.y=s.y+s.h;player.vy=0;
      if(s.ch==='?'){const b=blocks.find(b=>b.x===s.x&&b.y===s.y);
        if(b&&!b.used){b.used=true;score+=200;checkScoreLives();SFX.bump();
          solids.splice(solids.indexOf(s),1);blocks.splice(blocks.indexOf(b),1);
          for(let i=0;i<3;i++)coins.push({x:b.x+TS/2,y:b.y-10-i*14,r:8,taken:false,airborne:true,vy:-3-i});
          coinMagnet=60;
        }}
    }
  }
  if(player.y>H+60)killPlayer();

if(coinMagnet>0)coinMagnet--;
  for(const c of coins){
    if(c.taken)continue;
    if(c.airborne){
      c.vy+=0.4;c.y+=c.vy;
      for(const s of solids)if(c.x>s.x&&c.x<s.x+s.w&&c.y+8>s.y&&c.y+8<s.y+s.h&&c.vy>0){c.y=s.y-8;c.airborne=false;c.vy=0;}
    }
    if(coinMagnet>0){
      const dx=player.x+player.w/2-c.x,dy=player.y+player.h/2-c.y,dist=Math.hypot(dx,dy);
      if(dist<220&&dist>1){c.x+=dx/dist*4;c.y+=dy/dist*4;}
    }
    if(hit(player,{x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2})){c.taken=true;collectCoin(c.x,c.y);}
  }

for(const p of pickups)if(!p.taken&&hit(player,p)){p.taken=true;gainLife(1,'1-UP!');}
  for(const cp of checkpoints)if(!cp.active&&player.x>cp.x){
    cp.active=true;checkpoint={x:cp.x,y:cp.y};SFX.checkpoint();
    floaters.push({text:'CHECKPOINT!',x:cp.x,y:cp.y-20,life:90,color:'#5cf'});
  }

if(player.invuln>0)player.invuln--;
  for(const e of enemies){
    if(e.squashed){e.squashed++;continue;}
    e.x+=e.vx;
    let wall=false,edge=true;
    for(const s of solids){
      if(hit(e,s))wall=true;
      if(s.x===e.x+(e.vx>0?e.w+4:-4)&&Math.abs(s.y-(e.y+e.h))<8)edge=false;
    }
    if(wall||edge)e.vx*=-1;
    if(player.state==='alive'&&hit(player,e)){
      if(player.vy>1&&player.y+player.h<e.y+e.h*0.6){e.squashed=1;score+=300;checkScoreLives();SFX.stomp();player.vy=-7;}
      else killPlayer();
    }
  }
  enemies=enemies.filter(e=>e.squashed<30);
}

function update(){
  tick++;
  for(const f of floaters){f.y-=0.8;f.life--;}
  floaters=floaters.filter(f=>f.life>0);
  for(const p of coinParticles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;}
  coinParticles=coinParticles.filter(p=>p.life>0);
  if(levelStartFade>0)levelStartFade--;
  if(gameOver||won)return;
  if(deathAnim>0){
    physics();deathAnim--;
    if(deathAnim<=0)respawnPlayer();
    return;
  }
  if(levelStartFade<=0)physics();
  if(player.state==='alive'&&player.x>goalX-10){
    if(levelIndex<LEVELS.length-1){levelIndex++;SFX.win();loadLevel(levelIndex);}
    else{won=true;SFX.win();}
  }
  camX=Math.max(0,Math.min(player.x-W/2+100,levelW-W));
}

// ---------------- RENDER ----------------
function drawPlayer(){
  const p=player;
  if(p.state==='dying'){
    ctx.fillStyle='#d33';ctx.fillRect(p.x,p.y+6,p.w,p.h-6);
    ctx.fillStyle='#f88';ctx.fillRect(p.x+4,p.y,p.w-8,8);
    ctx.fillStyle='#d33';ctx.fillRect(p.x-6,p.y-6,10,6);ctx.fillRect(p.x+p.w-4,p.y-6,10,6);
    return;
  }
  if(p.invuln>0&&Math.floor(tick/4)%2)return;
  const bob=Math.floor(tick/8)%2;
  ctx.fillStyle='#d33';ctx.fillRect(p.x,p.y+6,p.w,p.h-6);
  ctx.fillStyle='#f88';ctx.fillRect(p.x+4,p.y,p.w-8,8);
  ctx.fillStyle='#fff';ctx.fillRect(p.x+(p.face>0?p.w-10:4),p.y+2,4,4);
  ctx.fillStyle='#345';ctx.fillRect(p.x,p.y+p.h-6-(bob?2:0),p.w,6);
}
function drawEnemy(e){
  if(e.squashed){ctx.fillStyle='#864';ctx.fillRect(e.x,e.y+e.h-10,e.w,10);return;}
  ctx.fillStyle='#8a4';ctx.fillRect(e.x,e.y,e.w,e.h-8);
  ctx.fillStyle='#531';ctx.fillRect(e.x+4,e.y+4,6,6);ctx.fillRect(e.x+e.w-10,e.y+4,6,6);
  ctx.fillStyle='#321';ctx.fillRect(e.x,e.y+e.h-8,e.w,8);
}
function drawScene(){
  const skies=['#5c94fc','#8a5cf5','#f5a05c'];
  ctx.fillStyle=skies[levelIndex];ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<5;i++){const cx=((i*300-camX*0.3)%(W+300)+W+300)%(W+300)-150;
    ctx.fillRect(cx,60,60,20);ctx.fillRect(cx+15,45,30,15);}
  ctx.save();ctx.translate(-camX,0);
  for(const s of solids){
    if(s.x-camX>W||s.x-camX<-TS)continue;
    if(s.ch==='G'){ctx.fillStyle='#7a4';ctx.fillRect(s.x,s.y,TS,TS);ctx.fillStyle='#5a3';ctx.fillRect(s.x,s.y+TS-8,TS,8);}
    else if(s.ch==='B'){ctx.fillStyle='#b63';ctx.fillRect(s.x,s.y,TS,TS);ctx.strokeStyle='#752';ctx.strokeRect(s.x+1,s.y+1,TS-2,TS-2);}
    else if(s.ch==='P'){ctx.fillStyle='#2a2';ctx.fillRect(s.x,s.y,TS,TS);ctx.fillStyle='#4c4';ctx.fillRect(s.x+4,s.y,8,TS);}
  }
  for(const b of blocks){
    if(b.used)continue;
    ctx.fillStyle='#fc0';ctx.fillRect(b.x,b.y,TS,TS);
    ctx.fillStyle='#963';ctx.font='bold 24px monospace';ctx.fillText('?',b.x+11,b.y+29);
  }
  for(const p of coinParticles){
    ctx.globalAlpha=Math.min(1,p.life/15);
    ctx.fillStyle='#fd3';ctx.fillRect(p.x-3,p.y-3,6,6);
    ctx.globalAlpha=1;
  }
  for(const c of coins)if(!c.taken){
    const phase=Math.abs(Math.sin(tick*0.1+c.x*0.05));
    const w=6+phase*10;
    ctx.fillStyle='#fd3';ctx.beginPath();ctx.ellipse(c.x,c.y,w,c.r,0,0,7);ctx.fill();
    ctx.fillStyle='#a80';ctx.fillRect(c.x-1,c.y-4,2,8);
  }
  for(const p of pickups)if(!p.taken){
    ctx.fillStyle='#3d3';ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('1',p.x+8,p.y+18);
  }
  for(const cp of checkpoints){
    ctx.fillStyle=cp.active?'#5cf':'#888';ctx.fillRect(cp.x+14,cp.y-30,6,50);
    ctx.fillStyle=cp.active?'#5cf':'#666';
    ctx.beginPath();ctx.moveTo(cp.x+20,cp.y-30);ctx.lineTo(cp.x+44,cp.y-20);ctx.lineTo(cp.x+20,cp.y-10);ctx.fill();
  }
  ctx.fillStyle='#eee';ctx.fillRect(goalX+10,H-6*TS,6,6*TS);
  ctx.fillStyle='#3d3';ctx.beginPath();ctx.moveTo(goalX+16,H-6*TS);ctx.lineTo(goalX+56,H-6*TS+20);ctx.lineTo(goalX+16,H-6*TS+40);ctx.fill();
  for(const e of enemies)drawEnemy(e);
  drawPlayer();
  ctx.font='bold 16px monospace';
  for(const f of floaters){ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}
  ctx.restore();

ctx.fillStyle='#fff';ctx.font='20px monospace';
  ctx.fillText('SCORE '+score+'   LEVEL '+(levelIndex+1)+'/3',16,28);
  ctx.fillText('🪙 '+coinCount+'/100',16,52);
  for(let i=0;i<Math.min(lives,8);i++){
    ctx.fillStyle='#f44';
    ctx.fillRect(W-30-i*24,14,10,10);ctx.fillRect(W-38-i*24,8,8,8);ctx.fillRect(W-20-i*24,8,8,8);
    ctx.fillRect(W-38-i*24,16,26,8);
  }
  if(lives>8){ctx.fillStyle='#fff';ctx.font='14px monospace';ctx.fillText('x'+lives,W-30-8*24,26);}
  ctx.fillStyle='#fff';ctx.font='14px monospace';
  ctx.fillText('next life @ '+nextLifeAt,W-180,46);
  ctx.fillText(muted?'🔇 M':'🔊 M',W-60,66);

if(levelStartFade>0){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-40,W,80);
    ctx.fillStyle='#fff';ctx.font='32px monospace';
    ctx.fillText('LEVEL '+(levelIndex+1)+'   LIVES: '+lives,300,H/2+10);
  }
  if(won){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-60,W,120);
    ctx.fillStyle='#fff';ctx.font='32px monospace';
    ctx.fillText('YOU BEAT ALL 3 LEVELS!',230,H/2-10);
    ctx.fillText('Final Score: '+score+'  — press Enter to play again',130,H/2+30);}
  if(gameOver){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-60,W,120);
    ctx.fillStyle='#f44';ctx.font='36px monospace';ctx.fillText('GAME OVER',330,H/2-10);
    ctx.fillStyle='#fff';ctx.font='20px monospace';
    ctx.fillText('Score: '+score+' — press Enter to retry',250,H/2+30);}
}

// ---- RESPONSIVE SCALING ----
function fitCanvas(){
  const scale=Math.min(window.innerWidth/(W+8),(window.innerHeight*0.7)/(H+8),1.5);
  canvas.style.width=(W*scale)+'px';
  canvas.style.height=(H*scale)+'px';
}
addEventListener('resize',fitCanvas);
fitCanvas();

loadLevel(0);
function loop(){update();drawScene();requestAnimationFrame(loop);}
loop();
</script>
